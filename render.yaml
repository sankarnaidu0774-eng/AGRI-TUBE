services:
  - type: web
    name: agriculture-tube
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: MUX_CORS_ORIGIN
        sync: false
